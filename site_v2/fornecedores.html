<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fornecedores — BTR Paraíso II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/style.css?v=1786800000">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body data-page="fornecedores">
<div id="original-content">
<style>
  .forn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .forn-card { background: white; border-left: 4px solid var(--gray-300); border-radius: 8px; padding: 14px 16px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .forn-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .forn-card.abc-a { border-left-color: #DC2626; }
  .forn-card.abc-b { border-left-color: #F59E0B; }
  .forn-card.abc-c { border-left-color: #16A34A; }
  .forn-name { font-weight: 600; font-size: 14px; color: #1F2937; }
  .forn-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .forn-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #E5E7EB; color: #374151; font-weight: 500; }
  .forn-tag.cat { background: #DBEAFE; color: #1E40AF; }
  .forn-tag.abc-a { background: #FEE2E2; color: #991B1B; }
  .forn-tag.abc-b { background: #FEF3C7; color: #92400E; }
  .forn-tag.abc-c { background: #DCFCE7; color: #14532D; }
  .forn-tag.warn { background: #FEF3C7; color: #92400E; }
  .forn-row { display: flex; justify-content: space-between; font-size: 12px; color: #6B7280; margin-top: 4px; }
  .forn-total { font-size: 18px; font-weight: 700; color: #1F4E78; }
  .forn-stars { color: #FCD34D; font-size: 11px; }

  /* Modal */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.6); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }
  .modal-content { background: white; border-radius: 12px; max-width: 720px; width: 100%; max-height: 90vh; overflow: auto; padding: 24px 28px; position: relative; }
  .modal-close { position: absolute; top: 12px; right: 16px; cursor: pointer; font-size: 24px; color: #6B7280; }
  .info-grid { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; font-size: 13px; margin-top: 12px; }
  .info-grid > div:nth-child(odd) { color: #6B7280; font-weight: 500; }
  .info-grid > div:nth-child(even) { color: #1F2937; }
  .pgto-row { display: grid; grid-template-columns: 90px 1fr 100px 80px; gap: 10px; padding: 8px 0; border-bottom: 1px solid #E5E7EB; font-size: 12px; align-items: center; }
  .pgto-row:hover { background: #F9FAFB; }
</style>

<div class="page-header">
  <div class="page-title">🏪 Fornecedores & Pagamentos</div>
  <div class="page-subtitle">Cadastro master + histórico de pagamentos · clique no card para ver detalhes</div>
</div>

<div class="kpi-grid">
  <div class="kpi"><div class="kpi-label">Fornecedores Únicos</div><div class="kpi-value" id="fNFor">—</div><div class="kpi-delta" id="fNForD">—</div></div>
  <div class="kpi success"><div class="kpi-label">Total Pago</div><div class="kpi-value" id="fTotal">—</div><div class="kpi-delta" id="fTotalD">—</div></div>
  <div class="kpi danger"><div class="kpi-label">Classe A (críticos)</div><div class="kpi-value" id="fA">—</div><div class="kpi-delta" id="fAD">—</div></div>
  <div class="kpi warning"><div class="kpi-label">Sem CNPJ/CPF</div><div class="kpi-value" id="fNCnpj">—</div><div class="kpi-delta">pendente cadastro</div></div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-header"><div class="card-title">📊 Top 10 Fornecedores</div></div>
    <div class="chart-wrap"><canvas id="chartTopF"></canvas></div>
  </div>
  <div class="card">
    <div class="card-header"><div class="card-title">📦 Distribuição por Tipo</div></div>
    <div class="chart-wrap"><canvas id="chartTipoF"></canvas></div>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <div class="card-title">🗂️ Todos os Fornecedores</div>
    <div style="display:flex; gap:10px;">
      <input type="search" id="searchForn" placeholder="🔍 Buscar..." style="padding:7px 11px; border:1px solid #D1D5DB; border-radius:6px; font-size:13px; width:200px;">
      <select id="filterABC" style="padding:7px 11px; border:1px solid #D1D5DB; border-radius:6px;">
        <option value="">Todos ABC</option>
        <option value="A">A — Críticos</option>
        <option value="B">B — Médios</option>
        <option value="C">C — Pequenos</option>
      </select>
      <select id="filterCat" style="padding:7px 11px; border:1px solid #D1D5DB; border-radius:6px;">
        <option value="">Todas categorias</option>
      </select>
    </div>
  </div>
  <div id="fornGrid" class="forn-grid"></div>
</div>

<!-- Modal de detalhe -->
<div class="modal" id="modal" onclick="if(event.target.id==='modal') closeModal()">
  <div class="modal-content">
    <div class="modal-close" onclick="closeModal()">✕</div>
    <div id="modalBody"></div>
  </div>
</div>

</div>
<script src="/assets/supabase-client.js?v=1786800000"></script>
<script src="/assets/app.js?v=1786800000"></script>
<script>
function initPage() {
  const D = window.DATA;
  const M = D.fornecedores_master || [];
  const P = D.fornecedores || [];

  // KPIs
  const total = M.reduce((s,f) => s + (f.total_pago||0), 0);
  document.getElementById('fNFor').textContent = M.length;
  document.getElementById('fNForD').textContent = P.length + ' pagamentos';
  document.getElementById('fTotal').textContent = fmt.money(total);
  document.getElementById('fTotalD').textContent = M.length + ' fornecedores ativos';
  const classeA = M.filter(f => f.abc === 'A');
  document.getElementById('fA').textContent = classeA.length;
  document.getElementById('fAD').textContent = fmt.money(classeA.reduce((s,f) => s + (f.total_pago||0), 0));
  const semCnpj = M.filter(f => !f.cnpj_cpf || f.cnpj_cpf.includes('CAU')).length;
  document.getElementById('fNCnpj').textContent = semCnpj;

  // Top 10 chart
  const top10 = M.slice(0, 10);
  new Chart(document.getElementById('chartTopF'), {
    type: 'bar',
    data: { labels: top10.map(f => f.nome.substring(0,20)),
      datasets: [{ data: top10.map(f => f.total_pago), backgroundColor: top10.map(f => f.abc==='A'?'#DC2626':f.abc==='B'?'#F59E0B':'#16A34A')}] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }},
      scales: { x: { ticks: { callback: v => 'R$ ' + (v/1000).toFixed(0) + 'k' }}}}
  });

  // Distribuição por categoria
  const catMap = {};
  M.forEach(f => { catMap[f.categoria || 'Outro'] = (catMap[f.categoria || 'Outro']||0) + (f.total_pago||0); });
  new Chart(document.getElementById('chartTipoF'), {
    type: 'doughnut',
    data: { labels: Object.keys(catMap),
      datasets: [{ data: Object.values(catMap), backgroundColor: ['#1F4E78','#FFC000','#16A34A','#DC2626','#6B7280'] }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' }}}
  });

  // Popular dropdown categorias
  const filterCat = document.getElementById('filterCat');
  [...new Set(M.map(f => f.categoria).filter(Boolean))].sort().forEach(c => {
    filterCat.insertAdjacentHTML('beforeend', `<option value="${c}">${c}</option>`);
  });

  // Render fornecedor card
  function renderCards() {
    const q = document.getElementById('searchForn').value.toLowerCase();
    const abc = document.getElementById('filterABC').value;
    const cat = document.getElementById('filterCat').value;
    const filtrados = M.filter(f =>
      (!q || (f.nome||'').toLowerCase().includes(q) || (f.subcategoria||'').toLowerCase().includes(q)) &&
      (!abc || f.abc === abc) &&
      (!cat || f.categoria === cat)
    );
    const grid = document.getElementById('fornGrid');
    if (filtrados.length === 0) {
      grid.innerHTML = '<div style="padding:30px; text-align:center; color:#9CA3AF; grid-column:1/-1;">Nenhum fornecedor encontrado</div>';
      return;
    }
    grid.innerHTML = filtrados.map(f => {
      const abc = f.abc || 'C';
      const stars = f.avaliacao_geral ? '⭐'.repeat(Math.round(Number(f.avaliacao_geral))) : '';
      const hasCnpj = f.cnpj_cpf && !f.cnpj_cpf.includes('CAU');
      return `
        <div class="forn-card abc-${abc.toLowerCase()}" onclick="openForn(${f.id})">
          <div class="forn-name">${f.nome}</div>
          <div class="forn-tags">
            <span class="forn-tag abc-${abc.toLowerCase()}">Classe ${abc}</span>
            ${f.categoria ? `<span class="forn-tag cat">${f.categoria}</span>` : ''}
            ${f.subcategoria ? `<span class="forn-tag">${f.subcategoria}</span>` : ''}
            ${f.tipo_pessoa ? `<span class="forn-tag">${f.tipo_pessoa}</span>` : ''}
            ${!hasCnpj ? `<span class="forn-tag warn">⚠ sem CNPJ</span>` : ''}
            ${stars ? `<span class="forn-stars">${stars}</span>` : ''}
          </div>
          <div class="forn-row">
            <span>${f.n_pagamentos || 0} pagamento(s)</span>
            <span class="forn-total">${fmt.money(f.total_pago || 0)}</span>
          </div>
          ${f.ultimo_pagamento ? `<div class="forn-row"><span>Último: ${fmt.date(f.ultimo_pagamento)}</span></div>` : ''}
        </div>`;
    }).join('');
  }

  document.getElementById('searchForn').oninput = renderCards;
  document.getElementById('filterABC').onchange = renderCards;
  document.getElementById('filterCat').onchange = renderCards;
  renderCards();

  window.openForn = (id) => {
    const f = M.find(x => x.id === id);
    if (!f) return;
    const pgtos = P.filter(p => p.fornecedor_id === id).sort((a,b) => new Date(b.data) - new Date(a.data));
    const stars = (n) => n ? '★'.repeat(n) + '☆'.repeat(5-n) : '—';

    document.getElementById('modalBody').innerHTML = `
      <h2 style="margin:0 0 4px;">${f.nome}</h2>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
        <span class="forn-tag abc-${(f.abc||'c').toLowerCase()}">Classe ${f.abc||'C'}</span>
        ${f.categoria ? `<span class="forn-tag cat">${f.categoria}</span>` : ''}
        ${f.subcategoria ? `<span class="forn-tag">${f.subcategoria}</span>` : ''}
        ${f.tipo_pessoa ? `<span class="forn-tag">${f.tipo_pessoa}</span>` : ''}
        <span class="forn-tag" style="background:${f.status==='ativo'?'#DCFCE7':'#FEE2E2'};">${f.status}</span>
      </div>

      <div class="kpi-grid" style="margin-bottom: 16px;">
        <div class="kpi success"><div class="kpi-label">Total Pago</div><div class="kpi-value">${fmt.money(f.total_pago)}</div></div>
        <div class="kpi"><div class="kpi-label">Pagamentos</div><div class="kpi-value">${f.n_pagamentos}</div></div>
        <div class="kpi accent"><div class="kpi-label">Avaliação</div><div class="kpi-value" style="font-size:20px;">${stars(Math.round(Number(f.avaliacao_geral) || 0))}</div></div>
        <div class="kpi"><div class="kpi-label">Contratos</div><div class="kpi-value">${f.n_contratos}</div></div>
      </div>

      <div class="card-title" style="margin-top:14px;">📇 Dados Cadastrais</div>
      <div class="info-grid">
        <div>CNPJ/CPF</div><div>${f.cnpj_cpf || '<em style="color:#DC2626;">não cadastrado</em>'}</div>
        ${f.inscricao_estadual ? `<div>IE</div><div>${f.inscricao_estadual}</div>` : ''}
        <div>Telefone</div><div>${f.telefone || '<em style="color:#9CA3AF;">—</em>'}</div>
        <div>WhatsApp</div><div>${f.whatsapp || '<em style="color:#9CA3AF;">—</em>'}</div>
        <div>Email</div><div>${f.email || '<em style="color:#9CA3AF;">—</em>'}</div>
        <div>Contato</div><div>${f.contato_principal || '<em style="color:#9CA3AF;">—</em>'}</div>
        <div>Endereço</div><div>${f.endereco ? f.endereco + (f.cidade ? ', ' + f.cidade + '/' + (f.uf||'') : '') : '<em style="color:#9CA3AF;">—</em>'}</div>
      </div>

      <div class="card-title" style="margin-top:14px;">💰 Dados Financeiros</div>
      <div class="info-grid">
        <div>Banco</div><div>${f.banco || '<em style="color:#9CA3AF;">—</em>'}</div>
        <div>PIX</div><div>${f.pix_key ? `${f.pix_key} (${f.pix_tipo})` : '<em style="color:#9CA3AF;">—</em>'}</div>
      </div>

      ${f.observacao ? `<div class="card-title" style="margin-top:14px;">📝 Observações</div><div style="font-size:13px; padding:10px 14px; background:#F9FAFB; border-radius:6px; color:#374151;">${f.observacao}</div>` : ''}

      <div class="card-title" style="margin-top:18px;">📋 Histórico de Pagamentos (${pgtos.length})</div>
      <div style="max-height:300px; overflow:auto;">
        <div class="pgto-row" style="font-weight:600; background:#F3F4F6; padding:6px 4px; border-radius:4px;">
          <div>Data</div><div>Descrição</div><div style="text-align:right;">Valor</div><div style="text-align:center;">Status</div>
        </div>
        ${pgtos.map(p => `
          <div class="pgto-row">
            <div style="color:#6B7280;">${fmt.date(p.data)}</div>
            <div style="font-size:11px;">${p.descricao || ''}</div>
            <div style="text-align:right; font-weight:600;">${fmt.money(p.valor_bruto)}</div>
            <div style="text-align:center;">${statusBadge(p.status)}</div>
          </div>
        `).join('')}
      </div>

      ${(D.user.papel === 'dono' || D.user.papel === 'engenheiro') ? `
        <div style="margin-top:18px; text-align:right;">
          <a href="/admin.html?tab=fornecedor&edit=${f.id}" class="topbar-btn" style="display:inline-block; padding:8px 14px; border-radius:6px; background:var(--primary); color:white;">✏️ Editar cadastro</a>
        </div>
      ` : ''}
    `;
    document.getElementById('modal').classList.add('open');
  };

  window.closeModal = () => {
    document.getElementById('modal').classList.remove('open');
  };
}
</script>
</body>
</html>
